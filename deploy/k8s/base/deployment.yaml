apiVersion: apps/v1
kind: Deployment
metadata:
  name: wake-buddy
  labels:
    app.kubernetes.io/name: wake-buddy
    app.kubernetes.io/part-of: wake-buddy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wake-buddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wake-buddy
        app.kubernetes.io/part-of: wake-buddy
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/manamana32321/kirothon-team-008:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TZ
              value: Asia/Seoul
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wake-buddy-data
